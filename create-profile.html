<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-ATS · Create Profile</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<script src="loader.js"></script>
<script>
window.PAGE = {
  active: 'profile-database',
  crumbs: [
    { label: 'Profile Database', href: 'pro-ats-profile-database.html' },
    { label: 'Create Profile' }
  ]
};
</script>

<div id="sidebarMount"></div>

<!-- ============ MAIN ============ -->
<div class="main" id="main">

  <div id="topbarMount"></div>

  <div class="content-pad">
    <div class="page-header fade-up">
      <div>
        <!-- <a href="pro-ats-profile-database.html" class="back-link"><i class="fa-solid fa-arrow-left"></i>Back to Profile Database</a> -->
        <h1>Create New Profile</h1>
        <p>Fill in the candidate details below to add a new profile to the database.</p>
      </div>
    </div>
  </div>

  <!-- FORM CARD — fills all remaining height, only form-scroll scrolls -->
  <form class="form-card fade-up" id="createForm">
    <div class="form-scroll">

      <div class="field-grid">
        <div class="field">
          <label>Requisition ID<span class="req">*</span></label>
          <select required>
            <option value="">Req ID</option>
            <option>#REQ-2026-001</option>
            <option>#REQ-2026-002</option>
            <option>#REQ-2026-003</option>
          </select>
        </div>
        <div class="field"><label>First Name<span class="req">*</span></label><input type="text" placeholder="First Name" required></div>
        <div class="field"><label>Middle Name</label><input type="text" placeholder="Middle Name"></div>
        <div class="field"><label>Last Name (Surname)<span class="req">*</span></label><input type="text" placeholder="Last Name" required></div>

        <div class="field"><label>Position<span class="req">*</span></label><input type="text" placeholder="Job Position" required></div>
        <div class="field"><label>Email<span class="req">*</span></label><input type="email" placeholder="email@example.com" required></div>
        <div class="field"><label>Phone Number<span class="req">*</span></label><input type="tel" placeholder="Phone Number" required></div>
        <div class="field"><label>Total Experience (Yrs)<span class="req">*</span></label><input type="number" min="0" step="0.1" placeholder="Years" required></div>

        <div class="field"><label>Relevant Experience (Yrs)<span class="req">*</span></label><input type="number" min="0" step="0.1" placeholder="Years" required></div>
        <div class="field"><label>Current Organization<span class="req">*</span></label><input type="text" placeholder="Company Name" required></div>
        <div class="field"><label>Current Location<span class="req">*</span></label><input type="text" placeholder="City / Region" required></div>
        <div class="field"><label>Current CTC (in Lakhs)<span class="req">*</span></label><input type="text" placeholder="₹5,00,000" required></div>

        <div class="field"><label>Expected CTC (in Lakhs)<span class="req">*</span></label><input type="text" placeholder="₹8,00,000" required></div>
        <div class="field"><label>Official Notice Period<span class="req">*</span></label><input type="text" placeholder="e.g., 30 days" required></div>
        <div class="field"><label>Negotiable Notice Period<span class="req">*</span></label><input type="text" placeholder="e.g., 30 days" required></div>
        <div class="field"><label>Preferred Location<span class="req">*</span></label><input type="text" placeholder="City / Region" required></div>

        <div class="field">
          <label>Sourcing Channel<span class="req">*</span></label>
          <select required>
            <option value="">Select Channel</option>
            <option>LinkedIn</option>
            <option>Referral</option>
            <option>Naukri</option>
            <option>Company Website</option>
          </select>
        </div>
        <div class="field"><label>Recruiter / Referral Name<span class="req">*</span></label><input type="text" placeholder="Full Name" required></div>
        <div class="field">
          <label>Status<span class="req">*</span></label>
          <select required>
            <option>Interested</option>
            <option>Screening</option>
            <option>Shortlisted</option>
            <option>On Hold</option>
          </select>
        </div>
      </div>

      <div class="field" style="margin-bottom:22px;">
        <label>Remarks</label>
        <textarea placeholder="Add any additional notes…"></textarea>
      </div>

      <label class="section-label">Attachment<span class="req">*</span></label>
      <div class="dropzone" id="dropzone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <div class="dz-title">Click to upload or drag and drop</div>
        <div class="dz-sub">PDF, DOC, DOCX (Max 10MB)</div>
        <div class="dz-filelist" id="dzFileList"></div>
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx" hidden multiple>
      </div>

    </div>

    <div class="form-actions">
      <a href="pro-ats-profile-database.html" class="btn-outline-soft">Cancel</a>
      <button type="button" class="btn-outline-soft">Save as Draft</button>
      <button type="submit" class="btn-primary-grad"><i class="fa-solid fa-paper-plane"></i>Create Profile</button>
    </div>
  </form>
</div>

<script>
// ---------- ATTACHMENT DROPZONE ----------
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const dzFileList = document.getElementById("dzFileList");

dropzone.addEventListener("click", ()=>fileInput.click());
["dragenter","dragover"].forEach(evt=>dropzone.addEventListener(evt, e=>{e.preventDefault(); dropzone.classList.add("dragover");}));
["dragleave","drop"].forEach(evt=>dropzone.addEventListener(evt, e=>{e.preventDefault(); dropzone.classList.remove("dragover");}));
dropzone.addEventListener("drop", e=>{ fileInput.files = e.dataTransfer.files; renderFiles(); });
fileInput.addEventListener("change", renderFiles);

function renderFiles(){
  dzFileList.innerHTML = "";
  Array.from(fileInput.files).forEach((f)=>{
    const chip = document.createElement("div");
    chip.className = "dz-file-chip";
    chip.innerHTML = `<i class="fa-regular fa-file-lines"></i><span>${f.name}</span><i class="fa-solid fa-xmark remove"></i>`;
    dzFileList.appendChild(chip);
  });
}

// ---------- SUBMIT ----------
document.getElementById("createForm").addEventListener("submit", function(e){
  e.preventDefault();
  window.location.href = "pro-ats-profile-database.html";
});
</script>
<script src="app.js"></script>
</body>
</html>
