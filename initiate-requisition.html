<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-ATS · Initiate New Requisition</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<script src="loader.js"></script>
<script>
(function(){
  const qp = new URLSearchParams(window.location.search);
  const isEdit = qp.get('edit') === '1';
  window.PAGE = {
    active: 'requisition-initiation',
    crumbs: [
      { label: 'Requisition Initiation', href: 'requisition-initiation.html' },
      { label: isEdit ? 'Edit Requisition' : 'Initiate New Requisition' }
    ]
  };
  if(isEdit) document.title = 'PRO-ATS · Edit Requisition';
})();
</script>

<div id="sidebarMount"></div>

<!-- ============ MAIN ============ -->
<div class="main" id="main">

  <div id="topbarMount"></div>

  <div class="content-pad">
    <div class="page-header fade-up">
      <div>
        <!-- <a href="requisition-initiation.html" class="back-link"><i class="fa-solid fa-arrow-left"></i>Back to Requisition Initiation</a> -->
        <h1 id="pageTitle">Initiate New Requisition</h1>
        <p id="pageSubtitle">Fill in the details below to raise a new hiring requisition.</p>
      </div>
    </div>
  </div>

  <!-- FORM CARD — fills all remaining height, only form-scroll scrolls -->
  <form class="form-card fade-up" id="requisitionForm">
    <div class="form-scroll">

      <div class="field-grid">
        <div class="field">
          <label>Vertical<span class="req">*</span></label>
          <select id="fldVertical" required>
            <option value="">Select Vertical</option>
            <option>SAP</option>
            <option>.NET</option>
            <option>LIMS</option>
            <option>Python</option>
            <option>CSV</option>
          </select>
        </div>
        <div class="field"><label>Client Name<span class="req">*</span></label><input id="fldClient" type="text" placeholder="Client Name" required></div>
        <div class="field"><label>Project<span class="req">*</span></label><input id="fldProject" type="text" placeholder="Project Name" required></div>
        <div class="field"><label>Skill / Module<span class="req">*</span></label><input id="fldSkill" type="text" placeholder="e.g. SAP FICO" required></div>

        <div class="field"><label>Years of Experience<span class="req">*</span></label><input type="text" placeholder="e.g. 5-7" required></div>
        <div class="field"><label>Total Positions<span class="req">*</span></label><input id="fldPositions" type="number" min="1" placeholder="Number of positions" required></div>
        <div class="field"><label>Budget<span class="req">*</span></label><input type="text" placeholder="₹ Budget" required></div>
        <div class="field"><label>Location</label><input type="text" placeholder="Location"></div>

        <div class="field">
          <label>Hiring Manager<span class="req">*</span></label>
          <select required>
            <option value="">Select Hiring Manager</option>
            <option>Rahul Sharma</option>
            <option>Anita Verma</option>
            <option>Srinivas Rao</option>
          </select>
        </div>
        <div class="field">
          <label>Employment Type</label>
          <select>
            <option value="">Select Employment Type</option>
            <option>Full Time</option>
            <option>Contract</option>
            <option>C2H</option>
          </select>
        </div>
        <div class="field">
          <label>Hiring Type</label>
          <select id="fldHiring">
            <option value="">Select Hiring Type</option>
            <option>Direct</option>
            <option>Agency</option>
            <option>Internal Referral</option>
            <option>Full Time</option>
          </select>
        </div>
        <div class="field"></div>

        <div class="field">
          <label>Duration<span class="req">*</span></label>
          <select required>
            <option value="">Select Duration</option>
            <option>3 Months</option>
            <option>6 Months</option>
            <option>12 Months</option>
            <option>Permanent</option>
          </select>
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="fldPriority">
            <option value="">Select Priority</option>
            <option>Critical</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div class="field"><label>Project Start Date<span class="req">*</span></label><input id="fldStart" type="date" value="2026-06-25" required></div>
        <div class="field"><label>Skill Set Required</label><input type="text" placeholder="comma separated skills"></div>
      </div>

      <div class="field-grid">
        <div class="field" style="grid-column:span 2;">
          <label>Internal Resources (multi select)</label>
          <div class="ms-select" id="msResources">
            <div class="ms-control" id="msControl" tabindex="0">
              <div class="ms-chips" id="msChips"></div>
              <span class="ms-placeholder" id="msPlaceholder">Select Resources</span>
              <i class="fa-solid fa-chevron-down ms-caret"></i>
            </div>
            <div class="ms-menu" id="msMenu">
              <label class="ms-option"><input type="checkbox" value="Arjun Nair"><span>Arjun Nair</span></label>
              <label class="ms-option"><input type="checkbox" value="Suresh Pillai"><span>Suresh Pillai</span></label>
              <label class="ms-option"><input type="checkbox" value="Meera Krishnan"><span>Meera Krishnan</span></label>
              <label class="ms-option"><input type="checkbox" value="Devika Nair"><span>Devika Nair</span></label>
              <label class="ms-option"><input type="checkbox" value="Anil Bose"><span>Anil Bose</span></label>
              <label class="ms-option"><input type="checkbox" value="Sneha Kulkarni"><span>Sneha Kulkarni</span></label>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Internal Resources Count</label>
          <input type="text" id="fldInternalCount" value="0" readonly>
        </div>
        <div class="field">
          <label>Balance for Hiring</label>
          <input type="text" id="fldBalance" value="0" readonly>
        </div>
      </div>

      <label class="section-label">Job Description (Attachment)<span class="req">*</span></label>
      <div class="dropzone" id="dropzone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <div class="dz-title">Click to upload or drag and drop</div>
        <div class="dz-sub">PDF, DOC, DOCX (Max 10MB)</div>
        <div class="dz-filelist" id="dzFileList"></div>
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx" hidden multiple>
      </div>

    </div>

    <div class="form-actions">
      <button type="button" class="btn-outline-soft"><i class="fa-regular fa-floppy-disk"></i> Save as draft</button>
      <button type="submit" class="btn-primary-grad" id="submitBtn"><i class="fa-solid fa-paper-plane"></i>Submit Requisition</button>
    </div>
  </form>
</div>

<script>
// ---------- EDIT MODE (prefill from Requisition Initiation table) ----------
const params = new URLSearchParams(window.location.search);
if(params.get("edit") === "1"){
  const reqId = params.get("id") || "";

  document.getElementById("pageTitle").innerHTML = `Edit Requisition <span style="font-size:11px;font-weight:700;color:var(--accent);background:var(--hover);padding:3px 10px;border-radius:20px;margin-left:6px;">${reqId}</span>`;
  document.getElementById("pageSubtitle").textContent = "Update the requisition details below.";
  document.getElementById("submitBtn").innerHTML = '<i class="fa-solid fa-floppy-disk"></i>Update Requisition';

  const setVal = (id, val) => { const el = document.getElementById(id); if(el && val) el.value = val; };
  setVal("fldVertical", params.get("vertical"));
  setVal("fldClient", params.get("client"));
  setVal("fldProject", params.get("project"));
  setVal("fldSkill", params.get("skill"));
  setVal("fldPositions", params.get("positions"));
  setVal("fldPriority", params.get("priority"));
  setVal("fldHiring", params.get("hiring"));

  const startRaw = params.get("start"); // dd/mm/yyyy
  if(startRaw){
    const [d,m,y] = startRaw.split("/");
    if(d && m && y) document.getElementById("fldStart").value = `${y}-${m}-${d}`;
  }
}

// ---------- INTERNAL RESOURCES (multi select) ----------
const msControl = document.getElementById("msControl");
const msMenu = document.getElementById("msMenu");
const msChips = document.getElementById("msChips");
const msPlaceholder = document.getElementById("msPlaceholder");
const msCheckboxes = Array.from(msMenu.querySelectorAll("input[type=checkbox]"));
const fldInternalCount = document.getElementById("fldInternalCount");
const fldBalance = document.getElementById("fldBalance");
const fldPositionsEl = document.getElementById("fldPositions");

function updateResourceSummary(){
  const selected = msCheckboxes.filter(c => c.checked);

  msChips.innerHTML = selected.map(c => `
    <span class="ms-chip" data-value="${c.value}">${c.value}<i class="fa-solid fa-xmark rm"></i></span>
  `).join("");
  msPlaceholder.style.display = selected.length ? "none" : "block";

  msChips.querySelectorAll(".rm").forEach(rm => {
    rm.addEventListener("click", (e) => {
      e.stopPropagation();
      const value = rm.parentElement.dataset.value;
      const cb = msCheckboxes.find(c => c.value === value);
      if(cb){ cb.checked = false; updateResourceSummary(); }
    });
  });

  const count = selected.length;
  fldInternalCount.value = count;

  const totalPositions = parseInt(fldPositionsEl.value, 10);
  const balance = isNaN(totalPositions) ? 0 : Math.max(totalPositions - count, 0);
  fldBalance.value = balance;
}

msControl.addEventListener("click", () => msMenu.classList.toggle("open"));
msCheckboxes.forEach(cb => cb.addEventListener("change", updateResourceSummary));
fldPositionsEl.addEventListener("input", updateResourceSummary);
document.addEventListener("click", (e) => {
  if(!document.getElementById("msResources").contains(e.target)) msMenu.classList.remove("open");
});
updateResourceSummary();

// ---------- ATTACHMENT DROPZONE ----------
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const dzFileList = document.getElementById("dzFileList");

dropzone.addEventListener("click", ()=>fileInput.click());
["dragenter","dragover"].forEach(evt=>dropzone.addEventListener(evt, e=>{e.preventDefault(); dropzone.classList.add("dragover");}));
["dragleave","drop"].forEach(evt=>dropzone.addEventListener(evt, e=>{e.preventDefault(); dropzone.classList.remove("dragover");}));
dropzone.addEventListener("drop", e=>{ fileInput.files = e.dataTransfer.files; renderFiles(); });
fileInput.addEventListener("change", renderFiles);

function renderFiles(){
  dzFileList.innerHTML = "";
  Array.from(fileInput.files).forEach((f)=>{
    const chip = document.createElement("div");
    chip.className = "dz-file-chip";
    chip.innerHTML = `<i class="fa-regular fa-file-lines"></i><span>${f.name}</span><i class="fa-solid fa-xmark remove"></i>`;
    dzFileList.appendChild(chip);
  });
}

// ---------- SUBMIT ----------
document.getElementById("requisitionForm").addEventListener("submit", function(e){
  e.preventDefault();
  window.location.href = "requisition-initiation.html";
});
</script>
<script src="app.js"></script>
</body>
</html>
