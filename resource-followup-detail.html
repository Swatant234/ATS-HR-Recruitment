<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-ATS · Resource Follow Up</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<script src="loader.js"></script>
<script>
window.PAGE = {
  active: 'resource-followup',
  crumbs: [
    { label: 'Resource Follow Up', href: 'resource-followup.html' },
    { label: 'Follow-up Details' }
  ]
};
</script>

<div id="sidebarMount"></div>

<!-- ============ MAIN ============ -->
<div class="main" id="main">

  <div id="topbarMount"></div>

  <div class="content-pad">
    <div class="page-header fade-up">
      <div>
        <h1>Resource Follow Up</h1>
        <p>Generate offer letters, route for approvals, track offer status, and manage counter-offers.</p>
      </div>
        <!-- <a href="resource-followup.html" class="btn-outline-soft"><i class="fa-solid fa-arrow-left"></i> Back</a> -->
    </div>
  </div>

  <!-- DETAIL CARD -->
  <div class="form-card ov-card fade-up d1" id="rfDetailCard">
    <div class="ov-card-scroll">

      <div class="ov-section-title">Follow-up Details</div>
      <div class="field-grid">
        <div class="field"><label>Requisition ID</label><input type="text" id="fReqId" readonly></div>
        <div class="field"><label>Vertical</label><input type="text" id="fVertical" readonly></div>
        <div class="field"><label>Position</label><input type="text" id="fPosition" readonly></div>
        <div class="field"><label>Resource</label><input type="text" id="fResource" readonly></div>
      </div>

      <div id="rfFollowupBlocks"></div>

    </div>

    <div class="form-actions">
      <button type="button" class="btn-outline-soft" id="noShowBtn"><i class="fa-solid fa-xmark"></i> Mark No Show</button>
      <button type="button" class="btn-primary-grad" id="initiateBtn"><i class="fa-solid fa-paper-plane"></i> Initiate for Onboarding</button>
    </div>
  </div>
</div>

<script>
// ---------- DEMO DATA (fallback if a field wasn't passed in the URL) ----------
const DEMO = {
  req:'REQ-4668', vertical:'LIMS', position:'Labware LIMS Master Data', resource:'Sai Kumar P', doj:'01-07-2026',
};

const qp = new URLSearchParams(window.location.search);
const get = (key) => qp.get(key) || DEMO[key] || '—';

document.getElementById('fReqId').value = get('req');
document.getElementById('fVertical').value = get('vertical');
document.getElementById('fPosition').value = get('position');
document.getElementById('fResource').value = get('resource');

// ---------- FOLLOW-UP RESPONSE ROWS ----------
const FOLLOWUPS = [
  {n:1, date:'01-07-2026', file:'Screenshot.png', responseDate:'02-07-2026', uploadedBy:'Prakash Reddy'},
  {n:2, date:'01-07-2026', file:'Screenshot.png', responseDate:'02-07-2026', uploadedBy:'Prakash Reddy'},
  {n:3, date:'01-07-2026', file:'Screenshot.png', responseDate:'02-07-2026', uploadedBy:'Prakash Reddy'},
  {n:4, date:'01-07-2026', file:'Screenshot.png', responseDate:'02-07-2026', uploadedBy:'Prakash Reddy'},
];

document.getElementById('rfFollowupBlocks').innerHTML = FOLLOWUPS.map(fu => `
  <div class="rf-followup-block">
    <div class="field-grid">
      <div class="field">
        <label>Follow-up ${fu.n} Date</label>
        <input type="text" value="${fu.date}" readonly>
      </div>
      <div class="field">
        <label>Response (Attachment)</label>
        <div class="file-choose">
          <button type="button" class="file-choose-btn" onclick="this.nextElementSibling.nextElementSibling.click()">Choose File</button>
          <span class="file-choose-name" id="fuFileName${fu.n}">${fu.file}</span>
          <input type="file" hidden id="fuFileInput${fu.n}" onchange="document.getElementById('fuFileName${fu.n}').textContent = this.files[0] ? this.files[0].name : 'No file chosen'">
        </div>
      </div>
      <div class="field">
        <label>Response Date</label>
        <input type="text" value="${fu.responseDate}">
      </div>
      <div class="field">
        <label>Uploaded By</label>
        <input type="text" value="${fu.uploadedBy}">
      </div>
    </div>
  </div>
`).join('');

document.getElementById('noShowBtn').addEventListener('click', () => {
  window.location.href = 'resource-followup.html';
});
document.getElementById('initiateBtn').addEventListener('click', () => {
  window.location.href = 'resource-followup.html';
});
</script>
<script src="app.js"></script>
</body>
</html>
